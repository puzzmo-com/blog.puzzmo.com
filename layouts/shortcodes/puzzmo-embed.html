<iframe
    title="Puzzmo Embed"
    src="https://www.puzzmo.com/_embed/latest.html?embedID={{ .Get "id" }}&theme={{ .Get "theme" | default "Puzzmo (light)" | urlquery }}"
    width="100%"
    height="{{ .Get "height" | default "600px" }}"
    frameborder="0"
    loading="lazy"
    allow="clipboard-write *; web-share *">
</iframe>
